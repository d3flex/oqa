name: test

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    continue-on-error:
      ${{ contains(fromJson('["snapshot"]'), matrix.emacs_version) }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        emacs_version:
          # 29.1 is skipped: package--reload-previously-loaded is broken there,
          # so upgrading the built-in seq (pulled in by transient) dies with
          # "Cannot open load file: seq-25". Fixed upstream in 29.2.
          - '28.1'
          - '28.2'
          - '29.2'
          - 'snapshot'
    steps:
      - uses: actions/checkout@v3
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}
      # conao3/setup-keg is a node12 action; node12 is gone from the runners
      # and has no arm64 macOS build, so it dies with spawn ENOEXEC. Install
      # Keg from upstream directly instead.
      - name: Install Keg
        run: |
          git clone --depth 1 https://github.com/conao3/keg.el.git "$HOME/keg"
          echo "$HOME/keg/bin" >> "$GITHUB_PATH"

      - run: keg install
      - run: keg run test-all
        env:
          UNDERCOVER_FORCE: true
      - uses: codecov/codecov-action@v2

  lint:
    runs-on: ubuntu-latest
    continue-on-error: ${{ true }}
    steps:
      - uses: actions/checkout@v1
      - uses: purcell/setup-emacs@master
        with:
          version: '28.1'
      - name: Install Keg
        run: |
          git clone --depth 1 https://github.com/conao3/keg.el.git "$HOME/keg"
          echo "$HOME/keg/bin" >> "$GITHUB_PATH"
      - run: keg lint
